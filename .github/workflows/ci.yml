name: NetSentry AI — Continuous Integration & Reliability Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  typescript-and-api-validation:
    name: TypeScript, Prisma & Frontend Build Verification
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Monorepo Dependencies
        run: npm ci

      - name: Build Shared Types Package
        run: npm run build --workspace=@netsentry/shared

      - name: Validate Prisma Schema & Generate Client
        run: |
          cd apps/api
          npx prisma validate
          npx prisma generate

      - name: Compile NestJS Core API (Typecheck & Build)
        run: npm run build --workspace=@netsentry/api

      - name: Compile Next.js SOC Dashboard (Production Build)
        run: npm run build --workspace=@netsentry/web
        env:
          NEXT_PUBLIC_API_URL: http://localhost:3001
          NEXT_PUBLIC_WS_URL: ws://localhost:3001

  python-ml-and-security-tests:
    name: Python ML Engine, XAI & Security Validation
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6380:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v4
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: Install ML Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r apps/ml/requirements.txt

      - name: Verify Experiment Consistency & Document Parity
        run: python scripts/validate_experiment_consistency.py

      - name: Run Fresh-Clone Bootstrap Audit
        run: python apps/ml/scripts/bootstrap.py

      - name: Run Pytest Test Suite
        run: |
          cd apps/ml
          python -m pytest tests/ -v
        env:
          REDIS_HOST: localhost
          REDIS_PORT: 6380
          ML_INTERNAL_AUTH_ENABLED: "false"

  docker-compose-security-audit:
    name: Docker Secret Hardening & Compose Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Codebase
        uses: actions/checkout@v4

      - name: Verify Docker Compose Config with .env.example
        run: docker compose --env-file .env.example config --quiet

      - name: Verify Fail-Closed Secret Enforcement (Missing Secrets Must Fail)
        run: |
          touch empty.env
          if docker compose --env-file empty.env config > /dev/null 2>&1; then
            echo "ERROR: Docker Compose should have failed when required secrets are missing!"
            exit 1
          else
            echo "SUCCESS: Docker Compose securely refused to start without required production secrets."
          fi
