services:
  postgres:
    image: postgres:16-alpine
    container_name: netsentry-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netsentry}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided in environment}
      POSTGRES_DB: ${POSTGRES_DB:-netsentry_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netsentry} -d ${POSTGRES_DB:-netsentry_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: netsentry-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: netsentry-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3001
      DATABASE_URL: postgresql://${POSTGRES_USER:-netsentry}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be provided in environment}@postgres:5432/${POSTGRES_DB:-netsentry_db}?schema=public
      REDIS_HOST: redis
      REDIS_PORT: 6379
      ML_SERVICE_URL: http://ml-api:8000
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be provided in environment}
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be provided in environment}
    ports:
      - "3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      ml-api:
        condition: service_healthy

  ml-api:
    build:
      context: apps/ml
      dockerfile: Dockerfile
    container_name: netsentry-ml-api
    restart: unless-stopped
    environment:
      PORT: 8000
      REDIS_HOST: redis
      REDIS_PORT: 6379
      INTERNAL_SERVICE_TOKEN: ${INTERNAL_SERVICE_TOKEN:?INTERNAL_SERVICE_TOKEN must be provided in environment}
      ML_INTERNAL_AUTH_ENABLED: ${ML_INTERNAL_AUTH_ENABLED:-true}
      NETSENTRY_PCAP_ROOT: /app/data/pcap
    expose:
      - "8000"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c 'import urllib.request; urllib.request.urlopen(\"http://localhost:8000/health\")'"]
      interval: 10s
      timeout: 5s
      retries: 5

  ml-worker:
    build:
      context: apps/ml
      dockerfile: Dockerfile
    container_name: netsentry-ml-worker
    restart: unless-stopped
    command: ["python", "-m", "app.streaming.worker"]
    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379
      CLAIM_IDLE_MS: ${CLAIM_IDLE_MS:-30000}
    depends_on:
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: netsentry-web
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      NEXT_PUBLIC_API_URL: http://localhost:3001
      NEXT_PUBLIC_WS_URL: ws://localhost:3001
    ports:
      - "3000:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
